name: CI Quality & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install locked Python dependencies
        run: pip install -r requirements.txt
      - name: Check interactive browser lab and portable course exports
        run: |
          node assets/readme/lab/export-lab.mjs --check
          python scripts/course_home/export_portable.py --check
          python scripts/course_home_en/export_portable.py --check
      - name: Run Chinese & English quality gates, SHA-256 manifest checks, and unit tests
        run: python scripts/run_portable_ci.py
