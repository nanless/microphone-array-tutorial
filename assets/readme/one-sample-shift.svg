<svg xmlns="http://www.w3.org/2000/svg" width="720" height="416" viewBox="0 0 720 416" role="img" aria-labelledby="title desc">
  <title id="title">A one-sample delay changes the average</title>
  <desc id="desc">Panel A: pulses on M1 and M2 at samples two and three give two half-height outputs. Panel B: delaying M1 moves its pulse to sample three and restores a full-height pulse.</desc>
  <defs>
    <pattern id="ticks" x="256" width="72" height="8" patternUnits="userSpaceOnUse"><path d="M0 0v8" stroke="#8195a6" stroke-width="2"/></pattern>
    <g id="axes">
      <path d="M238 0H638" fill="none" stroke="#9aabbb" stroke-width="1.5"/>
      <rect x="256" y="-4" width="366" height="8" fill="url(#ticks)"/>
    </g>
    <g id="full"><path d="M0 0v-27" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cy="-27" r="5.4" fill="currentColor"/></g>
    <g id="half"><path d="M0 0v-13.5" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cy="-13.5" r="5.4" fill="currentColor"/></g>
  </defs>
  <rect x="1" y="1" width="718" height="414" rx="22" fill="#f3f7fa" stroke="#d8e3ec"/>
  <rect x="16" y="16" width="688" height="186" rx="15" fill="#ffffff" stroke="#d8e3ec"/>
  <rect x="16" y="214" width="688" height="186" rx="15" fill="#ffffff" stroke="#d8e3ec"/>
  <g fill="#18354b"><circle cx="58" cy="52" r="21"/><circle cx="58" cy="250" r="21"/></g>
  <g font-family="Arial,sans-serif" font-weight="700" font-size="24" text-anchor="middle" fill="#fff"><text x="58" y="60">A</text><text x="58" y="258">B</text></g>
  <g font-family="Arial,sans-serif" font-size="23" font-weight="700">
    <g fill="#08685e"><text x="105" y="64">M1</text><text x="105" y="262">M1 +1</text></g>
    <g fill="#92540d"><text x="105" y="111">M2</text><text x="105" y="309">M2</text></g>
    <g fill="#3b4c82"><text x="105" y="158">½ Σ</text><text x="105" y="356">½ Σ</text></g>
  </g>
  <g fill="#edf4fb"><rect x="375" y="29" width="118" height="126" rx="9"/><rect x="449" y="227" width="46" height="126" rx="9"/></g>
  <g>
    <use href="#axes" y="61"/><use href="#axes" y="108"/><use href="#axes" y="155"/>
    <use href="#axes" y="259"/><use href="#axes" y="306"/><use href="#axes" y="353"/>
  </g>
  <g color="#087e72"><use href="#full" x="400" y="61"/><use href="#full" x="472" y="259"/></g>
  <g color="#b16b18"><use href="#full" x="472" y="108"/><use href="#full" x="472" y="306"/></g>
  <g color="#5162a0"><use href="#half" x="400" y="155"/><use href="#half" x="472" y="155"/><use href="#full" x="472" y="353"/></g>
  <g fill="#3e5466" font-family="Arial,sans-serif" font-size="21" text-anchor="middle">
    <text x="256" y="186">0</text><text x="328" y="186">1</text><text x="400" y="186">2</text><text x="472" y="186">3</text><text x="544" y="186">4</text><text x="616" y="186">5</text><text x="658" y="186" font-style="italic">n</text>
    <text x="256" y="384">0</text><text x="328" y="384">1</text><text x="400" y="384">2</text><text x="472" y="384">3</text><text x="544" y="384">4</text><text x="616" y="384">5</text><text x="658" y="384" font-style="italic">n</text>
  </g>
</svg>
