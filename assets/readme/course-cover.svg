<svg xmlns="http://www.w3.org/2000/svg" class="course-plot" viewBox="0 0 500 272" role="img" aria-labelledby="course-plot-title course-plot-desc">
        <title id="course-plot-title">声音怎样依次抵达四支麦克风</title>
        <desc id="course-plot-desc">左边发声时从 1 号到 4 号依次收到，右边发声时顺序相反。下方文字给出当前顺序。</desc>
        <defs>
          <pattern id="course-dots" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a7b3c7" opacity=".38"/></pattern>
        </defs>
<style>
.course-from-right,.course-wave,.course-hits circle{display:none}
.course-emitters circle{fill:#cbd7e7}
.course-emitters circle:first-child{fill:#ad402c}
.course-emitters text{fill:#17273d}
.course-emitters text:nth-child(3){fill:white}

@media (prefers-reduced-motion:no-preference) {
.course-wave{display:block;opacity:0;transform-origin:72px 144px;animation:spread 2.6s linear 3}
.course-hits circle{display:block;opacity:0;animation:hit 2.6s ease-out 3}
.course-hits circle:nth-child(1){animation-delay:.45s}
.course-hits circle:nth-child(2){animation-delay:.84s}
.course-hits circle:nth-child(3){animation-delay:1.22s}
.course-hits circle:nth-child(4){animation-delay:1.61s}
@keyframes spread{0%{opacity:0;transform:scale(.22)}12%{opacity:.8}65%{opacity:.62}80%,100%{opacity:0;transform:scale(2.35)}}
@keyframes hit{0%,19%,100%{opacity:0}5%{opacity:1}}
}
</style>
        <rect width="500" height="272" rx="12" fill="#eaf0f7"/>
        <rect width="500" height="272" rx="12" fill="url(#course-dots)"/>
        <path d="M55 144H445" stroke="#8497b3" stroke-width="2" stroke-dasharray="4 6"/>
        <g class="course-from-left" fill="none" stroke="#b74731" stroke-width="3" stroke-linecap="round">
          <path d="M104 129a25 25 0 0 1 0 30M120 114a47 47 0 0 1 0 60M137 98a70 70 0 0 1 0 92" opacity=".72"/>
          <path class="course-wave" d="M170 67a119 119 0 0 1 0 154"/>
        </g>
        <g class="course-from-right" fill="none" stroke="#b74731" stroke-width="3" stroke-linecap="round" transform="translate(500 0) scale(-1 1)">
          <path d="M104 129a25 25 0 0 1 0 30M120 114a47 47 0 0 1 0 60M137 98a70 70 0 0 1 0 92" opacity=".72"/>
          <path class="course-wave" d="M170 67a119 119 0 0 1 0 154"/>
        </g>
        <rect x="148" y="119" width="204" height="50" rx="17" fill="#192940"/>
        <g fill="#1b304c" stroke="#99b6f1" stroke-width="2">
          <circle cx="175" cy="144" r="10"/><circle cx="225" cy="144" r="10"/>
          <circle cx="275" cy="144" r="10"/><circle cx="325" cy="144" r="10"/>
        </g>
        <g class="course-hits" fill="#ffe095">
          <circle cx="175" cy="144" r="8"/><circle cx="225" cy="144" r="8"/>
          <circle cx="275" cy="144" r="8"/><circle cx="325" cy="144" r="8"/>
        </g>
        <g font-family="system-ui,sans-serif" font-weight="700" font-size="18" text-anchor="middle" fill="#2a4263">
          <text x="175" y="200">1</text><text x="225" y="200">2</text><text x="275" y="200">3</text><text x="325" y="200">4</text>
        </g>
        <g class="course-emitters" font-family="system-ui,sans-serif" font-size="22" font-weight="750" text-anchor="middle">
          <circle cx="72" cy="144" r="24"/><circle cx="428" cy="144" r="24"/>
          <text x="72" y="152">A</text><text x="428" y="152">B</text>
        </g>
      </svg>
