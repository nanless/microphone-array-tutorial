<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" role="img" aria-labelledby="title desc">
  <title id="title">Two sources, one microphone array</title>
  <desc id="desc">The left source A reaches M1 first; the right source B reaches M4 first. The blue and gold paths are schematic, not drawn to scale.</desc>
  <defs>
    <linearGradient id="room" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#152b3e"/><stop offset="1" stop-color="#0a1623"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b8d8e7" stroke-opacity=".08"/>
    </pattern>
    <marker id="a" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto">
      <path d="m0 0 10 5-10 5z" fill="#69e5d2"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto">
      <path d="m0 0 10 5-10 5z" fill="#ffc077"/>
    </marker>
  </defs>
  <style>
    .pulse { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .pulse { animation: pass 3s ease-out 3; }
      .p1 { animation-delay: .05s; } .p2 { animation-delay: .16s; }
      .p3 { animation-delay: .27s; } .p4 { animation-delay: .38s; }
      .p5 { animation-delay: 1.15s; } .p6 { animation-delay: 1.26s; }
      .p7 { animation-delay: 1.37s; } .p8 { animation-delay: 1.48s; }
      @keyframes pass { 0%, 25%, 100% { opacity: 0; } 7% { opacity: 1; } }
    }
  </style>
  <rect x="1" y="1" width="798" height="382" rx="25" fill="url(#room)" stroke="#355265" stroke-width="2"/>
  <rect x="26" y="26" width="748" height="332" rx="17" fill="url(#grid)" stroke="#355265" stroke-dasharray="5 8"/>
  <!-- Paths are representative (nearest and farthest microphone for each source). -->
  <g fill="none" stroke-width="3">
    <path d="M164 128 262 267" stroke="#69e5d2" marker-end="url(#a)"/>
    <path d="M173 111 509 269" stroke="#69e5d2" opacity=".50" stroke-dasharray="6 9"/>
    <path d="M636 128 538 267" stroke="#ffc077" marker-end="url(#b)"/>
    <path d="M627 111 291 269" stroke="#ffc077" opacity=".50" stroke-dasharray="6 9"/>
  </g>
  <g fill="none" stroke-width="2">
    <circle cx="134" cy="94" r="51" stroke="#69e5d2" opacity=".19"/>
    <circle cx="134" cy="94" r="42" stroke="#69e5d2" opacity=".37"/>
    <circle cx="666" cy="94" r="51" stroke="#ffc077" opacity=".19"/>
    <circle cx="666" cy="94" r="42" stroke="#ffc077" opacity=".37"/>
  </g>
  <circle cx="134" cy="94" r="33" fill="#69e5d2"/>
  <circle cx="666" cy="94" r="33" fill="#ffc077"/>
  <g fill="#101e2c" font-family="system-ui,sans-serif" font-weight="750" font-size="32" text-anchor="middle">
    <text x="134" y="105">A</text><text x="666" y="105">B</text>
  </g>
  <g fill="none" stroke-width="3">
    <path d="M225 204q-10-6-14-17m27 9q-9-13-22-19" stroke="#69e5d2" opacity=".48"/>
    <path d="M575 204q10-6 14-17m-27 9q9-13 22-19" stroke="#ffc077" opacity=".48"/>
  </g>
  <rect x="227" y="276" width="346" height="40" rx="20" fill="#182d3e" stroke="#486576" stroke-width="2"/>
  <path d="M274 296h252" stroke="#486576" stroke-width="2"/>
  <g fill="#142939" stroke="#cadde5" stroke-width="2">
    <circle cx="274" cy="296" r="12"/><circle cx="358" cy="296" r="12"/>
    <circle cx="442" cy="296" r="12"/><circle cx="526" cy="296" r="12"/>
  </g>
  <g fill="#69e5d2">
    <circle class="pulse p1" cx="274" cy="296" r="10"/><circle class="pulse p2" cx="358" cy="296" r="10"/>
    <circle class="pulse p3" cx="442" cy="296" r="10"/><circle class="pulse p4" cx="526" cy="296" r="10"/>
  </g>
  <g fill="#ffc077">
    <circle class="pulse p5" cx="526" cy="296" r="10"/><circle class="pulse p6" cx="442" cy="296" r="10"/>
    <circle class="pulse p7" cx="358" cy="296" r="10"/><circle class="pulse p8" cx="274" cy="296" r="10"/>
  </g>
  <g fill="#e8f6fb" font-family="system-ui,sans-serif" font-weight="650" font-size="23" text-anchor="middle">
    <text x="274" y="346">M1</text><text x="358" y="346">M2</text>
    <text x="442" y="346">M3</text><text x="526" y="346">M4</text>
  </g>
</svg>
