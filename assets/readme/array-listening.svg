<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-labelledby="title desc">
  <title id="title">One source, two microphones</title>
  <desc id="desc">Sound paths of different lengths reach two microphones. The onset marker in microphone 2's record is farther along the time axis.</desc>
