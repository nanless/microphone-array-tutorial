name: Publish course to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'figures/**'
      - 'dist/microphone-array-tutorial.pdf'
      - 'assets/readme/lab/**'
      - 'assets/readme/cases/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify published assets and portable exports before staging
        shell: bash
        run: |
          node assets/readme/lab/export-lab.mjs --check
          python3 scripts/course_home/export_portable.py --check
          python3 - <<'PY'
          import pathlib, sys
          pdf = pathlib.Path("dist/microphone-array-tutorial.pdf")
          if not pdf.is_file() or pdf.stat().st_size == 0 or pdf.stat().st_size >= 100 * 1024 * 1024:
              sys.exit(f"Invalid PDF size: {pdf.stat().st_size if pdf.exists() else 'missing'}")
          html_pages = sorted(pathlib.Path("site").rglob("*.html"))
          if len(html_pages) < 33:
              sys.exit(f"Expected at least 33 HTML pages in site/, got {len(html_pages)}")
          if not (pathlib.Path("site/index.html")).is_file():
              sys.exit("Missing site/index.html")
          print(f"Verified {len(html_pages)} HTML pages and PDF ({pdf.stat().st_size} bytes)")
          PY
      - uses: actions/configure-pages@v6
      - name: Stage the course and its media
        shell: bash
        run: |
          mkdir -p _pages/assets/readme/lab _pages/dist
          cp -R site figures _pages/
          cp assets/readme/lab/{array-lab.html,single.wav,left.wav,right.wav} _pages/assets/readme/lab/
          cp -R assets/readme/cases _pages/assets/readme/
          cp dist/microphone-array-tutorial.pdf _pages/dist/
          cat > _pages/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="0; url=./site/">
          <title>麦克风阵列信号处理 · 从入门到工业实践</title>
          <a href="./site/">进入课程</a>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
