<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc">
  <title id="title">Make the four copies of source A arrive together</title>
  <desc id="desc">On microphones M1 to M4, source A starts at samples 0, 2, 4 and 6. Adding waits of 6, 4, 2 and 0 samples moves the four arrivals to sample 6.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="m0 0 10 5-10 5z" fill="#a5c1d1"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="298" rx="22" fill="#122637" stroke="#486576" stroke-width="2"/>
  <path d="M148 47H704M148 102H704M148 150H704M148 198H704M148 246H704" stroke="#476172" stroke-width="1"/>
  <path d="M184 47v207m160-207v207m160-207v207m160-207v207" stroke="#67808f" stroke-opacity=".38" stroke-dasharray="4 7"/>
  <path d="M664 47v207" stroke="#69e5d2" stroke-width="2" stroke-opacity=".64"/>
  <g fill="#d9eaf2" font-family="system-ui,sans-serif" font-size="26" font-weight="650" text-anchor="middle">
    <text x="184" y="36">0</text><text x="344" y="36">2</text><text x="504" y="36">4</text><text x="664" y="36">6</text>
    <text x="91" y="111">M1</text><text x="91" y="159">M2</text><text x="91" y="207">M3</text><text x="91" y="255">M4</text>
  </g>
  <g fill="none" stroke="#a5c1d1" stroke-width="2">
    <path d="M198 102H646" marker-end="url(#arrow)"/>
    <path d="M358 150H646" marker-end="url(#arrow)"/>
    <path d="M518 198H646" marker-end="url(#arrow)"/>
  </g>
  <g fill="#122637" stroke="#69e5d2" stroke-width="3">
    <circle cx="184" cy="102" r="8"/><circle cx="344" cy="150" r="8"/><circle cx="504" cy="198" r="8"/>
  </g>
  <g fill="#69e5d2">
    <circle cx="664" cy="102" r="9"/><circle cx="664" cy="150" r="9"/>
    <circle cx="664" cy="198" r="9"/><circle cx="664" cy="246" r="9"/>
  </g>
</svg>
