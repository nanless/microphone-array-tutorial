name: CI Quality & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install locked Python dependencies
        run: pip install -r requirements.txt
      - name: Check interactive browser lab and portable course exports
        run: |
          node assets/readme/lab/export-lab.mjs --check
          python scripts/course_home/export_portable.py --check
          python scripts/course_home_en/export_portable.py --check
      - name: Build intermediate combined HTML and run Chinese & English quality gates
        run: |
          python scripts/build_pdf.py --html-only
          python scripts/build_pdf_en.py --html-only
          python scripts/quality_check.py
          python scripts/quality_check_en.py
      - name: Run full unit test suite
        run: python -m unittest discover -s tests -p 'test_*.py'
