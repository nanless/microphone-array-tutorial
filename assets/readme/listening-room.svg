<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" role="img" aria-labelledby="title desc">
  <title id="title">Two sources, one microphone array</title>
  <desc id="desc">The left source A reaches M1 first; the right source B reaches M4 first. The Prussian blue and terracotta paths are schematic, not drawn to scale.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#8D8577" stroke-opacity=".14"/>
    </pattern>
    <marker id="a" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto">
      <path d="m0 0 10 5-10 5z" fill="#1F5A92"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto">
      <path d="m0 0 10 5-10 5z" fill="#B84A2E"/>
    </marker>
  </defs>
  <style>
    .pulse { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .pulse { animation: pass 3s ease-out 3; }
      .p1 { animation-delay: .05s; } .p2 { animation-delay: .16s; }
      .p3 { animation-delay: .27s; } .p4 { animation-delay: .38s; }
      .p5 { animation-delay: 1.15s; } .p6 { animation-delay: 1.26s; }
      .p7 { animation-delay: 1.37s; } .p8 { animation-delay: 1.48s; }
      @keyframes pass { 0%, 25%, 100% { opacity: 0; } 7% { opacity: 1; } }
    }
  </style>
  <rect x="1" y="1" width="798" height="382" rx="16" fill="#FAF8F3" stroke="#D5CFC2" stroke-width="2"/>
  <rect x="24" y="24" width="752" height="336" rx="10" fill="#FFFFFF" stroke="#DDD7CB"/>
  <rect x="24" y="24" width="752" height="336" rx="10" fill="url(#grid)"/>
  <!-- Paths are representative (nearest and farthest microphone for each source). -->
  <g fill="none" stroke-width="2.8">
    <path d="M164 128 262 267" stroke="#1F5A92" marker-end="url(#a)"/>
    <path d="M173 111 509 269" stroke="#1F5A92" opacity=".46" stroke-dasharray="6 8"/>
    <path d="M636 128 538 267" stroke="#B84A2E" marker-end="url(#b)"/>
    <path d="M627 111 291 269" stroke="#B84A2E" opacity=".46" stroke-dasharray="6 8"/>
  </g>
  <g fill="none" stroke-width="2">
    <circle cx="134" cy="94" r="51" stroke="#1F5A92" opacity=".18"/>
    <circle cx="134" cy="94" r="42" stroke="#1F5A92" opacity=".36"/>
    <circle cx="666" cy="94" r="51" stroke="#B84A2E" opacity=".18"/>
    <circle cx="666" cy="94" r="42" stroke="#B84A2E" opacity=".36"/>
  </g>
  <circle cx="134" cy="94" r="32" fill="#1F5A92"/>
  <circle cx="666" cy="94" r="32" fill="#B84A2E"/>
  <g fill="#FFFFFF" font-family="system-ui,sans-serif" font-weight="800" font-size="30" text-anchor="middle">
    <text x="134" y="105">A</text><text x="666" y="105">B</text>
  </g>
  <g fill="none" stroke-width="2.6">
    <path d="M225 204q-10-6-14-17m27 9q-9-13-22-19" stroke="#1F5A92" opacity=".5"/>
    <path d="M575 204q10-6 14-17m-27 9q9-13 22-19" stroke="#B84A2E" opacity=".5"/>
  </g>
  <rect x="227" y="276" width="346" height="40" rx="20" fill="#2A2F35" stroke="#555B64" stroke-width="1.8"/>
  <path d="M274 296h252" stroke="#686F7A" stroke-width="1.6"/>
  <g fill="#FAF8F3" stroke="#1F5A92" stroke-width="2.2">
    <circle cx="274" cy="296" r="11"/><circle cx="358" cy="296" r="11"/>
    <circle cx="442" cy="296" r="11"/><circle cx="526" cy="296" r="11"/>
  </g>
  <g fill="#1F5A92">
    <circle class="pulse p1" cx="274" cy="296" r="9"/><circle class="pulse p2" cx="358" cy="296" r="9"/>
    <circle class="pulse p3" cx="442" cy="296" r="9"/><circle class="pulse p4" cx="526" cy="296" r="9"/>
  </g>
  <g fill="#B84A2E">
    <circle class="pulse p5" cx="526" cy="296" r="9"/><circle class="pulse p6" cx="442" cy="296" r="9"/>
    <circle class="pulse p7" cx="358" cy="296" r="9"/><circle class="pulse p8" cx="274" cy="296" r="9"/>
  </g>
  <g fill="#2C2F33" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" font-size="21" text-anchor="middle">
    <text x="274" y="344">M1</text><text x="358" y="344">M2</text>
    <text x="442" y="344">M3</text><text x="526" y="344">M4</text>
  </g>
</svg>
